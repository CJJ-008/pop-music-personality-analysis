# 全局主题（zcode.md 决策 D34）：登录页与主应用 8 个页面共用一套深色配色。
# 之前没有本文件，应用跑 Streamlit 默认主题、跟随观看者浏览器的主题设置；
# 锁定后 exe、云端、答辩现场看到的是同一套观感。
# 注意：重新打包 exe 时需确认 streamlit_app.spec 的 datas 带上本文件，否则 exe 里没有主题。
[theme]
base = "dark"                        # 深色基底
primaryColor = "#ff4b4b"             # 主色沿用红色（主按钮/焦点描边/标签下划线都不变色）
backgroundColor = "#0e1117"          # 页面底色
secondaryBackgroundColor = "#161b26" # 卡片 / 侧边栏 / 输入框底色
textColor = "#f5f5f5"
